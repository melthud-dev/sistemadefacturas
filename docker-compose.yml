services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pdfs_data:/usr/src/app/data/pdfs
    ports:
      - "3000:3000" # solo para pruebas locales; cloudflared es lo que expone a internet

  # Tunel de Cloudflare: expone "app" a internet sin abrir puertos en el router
  # ni pagar hosting. Requiere crear el tunel en Cloudflare Zero Trust y pegar
  # el token en TUNNEL_TOKEN dentro de .env. Ver README para el paso a paso.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  db_data:
  pdfs_data:
